# Alle Tests bei jedem Push und Pull Request – auf Linux (Ubuntu 24.04, System-Python 3.12 wie im .deb) und auf
# Windows (Python 3.13 wie beim Installer). Tests und Werkzeuge liegen unter progress/.
name: Tests (Windows und Linux)

on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Pakete (wie im .deb, dazu virtueller Bildschirm)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-tk python3-pil xdg-utils poppler-utils xclip \
            tkdnd xvfb xauth fonts-dejavu-core imagemagick git
      - name: Jupyter (für den Test der Notebook-Werkzeuge)
        run: sudo apt-get install -y -q --no-install-recommends python3-nbclient python3-ipykernel python3-matplotlib
      - name: Tests
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s progress/tests -v
      - name: Fenster ziehen messen (nur zur Info)
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1920x1200x24" /usr/bin/python3 progress/tools/bench_resize.py --profile
      - name: Bedienung messen – Moduswechsel, Seitenleiste, Galerie (nur zur Info)
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1920x1200x24" /usr/bin/python3 progress/tools/bench_ui.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Jupyter (für den Test der Notebook-Werkzeuge)
        run: python -m pip install --quiet nbclient ipykernel matplotlib
      - name: Tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s progress/tests -v
      - name: Fenster ziehen messen (nur zur Info)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: python progress/tools/bench_resize.py --profile
      - name: Bedienung messen – Moduswechsel, Seitenleiste, Galerie (nur zur Info)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: python progress/tools/bench_ui.py

